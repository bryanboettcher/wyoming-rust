name: Build multi-arch images

on:
  push:
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Native build — runs tests
  build-native:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test (x86_64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:x86_64
          cache-from: type=gha,scope=x86_64
          cache-to: type=gha,mode=max,scope=x86_64

      - name: Push x86_64
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:x86_64
          cache-from: type=gha,scope=x86_64
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}

  # Cross-compiled builds — no tests (can't run foreign binaries)
  build-cross:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: arm-unknown-linux-gnueabihf
            tag: armv6
            # The binary is compiled for armhf (hard float) which needs /lib/ld-linux-armhf.so.3.
            # linux/arm/v5 is armel (soft float) with a different dynamic linker, causing exec failures.
            # ARMv7 images work on ARMv6 hardware; Docker falls back from v6 to v7 automatically.
            platform: linux/arm/v7
            build-args: |
              RUST_TARGET=arm-unknown-linux-gnueabihf
              USE_ARMV6_TOOLCHAIN=1
              LINKER=armv6-rpi-linux-gnueabihf-gcc
              STRIP_CMD=armv6-rpi-linux-gnueabihf-strip
              RUSTFLAGS_EXTRA=-C target-cpu=arm1176jzf-s
              CROSS_PKG_CONFIG_LIBDIR=/opt/x-tools/armv6-rpi-linux-gnueabihf/armv6-rpi-linux-gnueabihf/sysroot/usr/lib/pkgconfig
          - target: armv7-unknown-linux-gnueabihf
            tag: armv7
            platform: linux/arm/v7
            build-args: |
              RUST_TARGET=armv7-unknown-linux-gnueabihf
              CROSS_PKG=gcc-arm-linux-gnueabihf libc6-dev-armhf-cross libasound2-dev:armhf
              LINKER=arm-linux-gnueabihf-gcc
              STRIP_CMD=arm-linux-gnueabihf-strip
              CROSS_PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabihf/pkgconfig
          - target: aarch64-unknown-linux-gnu
            tag: arm64
            platform: linux/arm64
            build-args: |
              RUST_TARGET=aarch64-unknown-linux-gnu
              CROSS_PKG=gcc-aarch64-linux-gnu libc6-dev-arm64-cross libasound2-dev:arm64
              LINKER=aarch64-linux-gnu-gcc
              STRIP_CMD=aarch64-linux-gnu-strip
              CROSS_PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig
          - target: i686-unknown-linux-gnu
            tag: i686
            platform: linux/386
            build-args: |
              RUST_TARGET=i686-unknown-linux-gnu
              CROSS_PKG=gcc-multilib libc6-dev-i386 libasound2-dev:i386
              CROSS_PKG_CONFIG_LIBDIR=/usr/lib/i386-linux-gnu/pkgconfig
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.tag }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}

  # Combine arch-specific images into a multi-arch manifest
  manifest:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [build-native, build-cross]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest (latest)
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:x86_64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:armv6 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:armv7 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:arm64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:i686

      - name: Create and push manifest (version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:x86_64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:armv6 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:armv7 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:arm64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:i686
