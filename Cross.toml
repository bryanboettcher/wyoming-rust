# Configuration for `cross` (https://github.com/cross-rs/cross)
# Usage: cross build --release --target arm-unknown-linux-gnueabihf

[target.arm-unknown-linux-gnueabihf]
# Custom Dockerfile that installs ALSA dev headers into the cross sysroot.
dockerfile = { file = "Dockerfile.cross-env" }

[target.arm-unknown-linux-gnueabihf.env]
passthrough = ["PKG_CONFIG_ALLOW_CROSS=1"]

[build]
# Default target when using `cross build` without --target
default-target = "arm-unknown-linux-gnueabihf"
