# Wyoming satellite configuration for Raspberry Pi Zero W deployment.
#
# Mount this file into the container at /data/satellite.toml:
#   docker run --rm -v ./config:/data --device /dev/snd \
#     ghcr.io/bryanboettcher/wyoming-satellite:latest
#
# WAV files referenced in this config should also live under /data/.

[satellite]
name = "my-satellite"
area = "Living Room"

[server]
# In "listen" mode the satellite binds a TCP server and waits for
# Home Assistant (or another Wyoming client) to connect to it.
mode = "listen"
host = "0.0.0.0"
port = 10700

[audio]
# ALSA capture device on the Pi. Use `arecord -L` to list devices.
# Common values: "plughw:0,0", "hw:1,0" (for USB mic), "default"
device = "plughw:0,0"

# PCM format — 16 kHz, 16-bit mono is the Wyoming standard.
rate = 16000
width = 2
channels = 1
chunk_ms = 20

[vad]
# Voice Activity Detection mode.
# Available modes:
#   "always_on" — auto-trigger for testing (default if [vad] omitted)
#   "gpio"      — hardware button or Schmitt trigger on a GPIO pin
#   "energy"    — software RMS threshold on mic audio
mode = "gpio"
pin = 17
silence_timeout_ms = 2500

# Energy-based VAD example (USB mic, no GPIO):
# [vad]
# mode = "energy"
# threshold = 1000
# silence_timeout_ms = 2500

# ============================================================================
# Feedback providers
# ============================================================================
# Multiple providers can run simultaneously. If none are specified, a
# logging-only provider is used by default.
#
# Available methods: "log", "console", "pwm", "neopixel"
#
# Each provider supports per-state configuration via a [feedback.states]
# sub-table. States: idle, listening, detected, processing, speaking, error.
# Unconfigured states are noops.

# Always-on log provider (state transitions to env_logger)
[[feedback]]
method = "log"

# Console output example:
# [[feedback]]
# method = "console"
# output = "stdout"
#
# [feedback.states]
# idle = { template = "Ready and waiting" }
# listening = { template = "Listening..." }
# detected = { template = "Wake word detected!" }
# processing = { template = "Processing..." }
# speaking = { template = "Speaking response" }
# error = { template = "ERROR: disconnected" }

# PWM LED example (single-color LED on GPIO 24):
# [[feedback]]
# method = "pwm"
# pin = 24
#
# [feedback.states.idle]
# effect = "off"
#
# [feedback.states.listening]
# effect = "breathe"
# frequency = 1000.0
# period_ms = 2000
#
# [feedback.states.detected]
# effect = "solid"
# frequency = 1000.0

# PWM buzzer example (piezo on GPIO 25):
# [[feedback]]
# method = "pwm"
# pin = 25
#
# [feedback.states.detected]
# effect = "pulse"
# frequency = 880.0
# count = 2
# pulse_ms = 150

# NeoPixel/WS2812 RGB strip example (3 LEDs via SPI):
# [[feedback]]
# method = "neopixel"
# pin = 8
# led_count = 3
#
# [feedback.states.idle]
# effect = "solid"
# color = 0x000800
# brightness = 0.1
#
# [feedback.states.listening]
# effect = "breathe"
# color = 0x000080
# period_ms = 2000
#
# [feedback.states.detected]
# effect = "rainbow"
# period_ms = 1000
#
# [feedback.states.speaking]
# effect = "solid"
# color = 0x800080
