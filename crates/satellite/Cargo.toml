[package]
name = "wyoming-satellite"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Wyoming protocol satellite for Home Assistant voice pipelines"

[[bin]]
name = "wyoming-satellite"
path = "src/main.rs"

[dependencies]
wyoming = { path = "../wyoming" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
toml = "0.8"
thiserror = "2"
hound = "3"
libc = "0.2"
rppal = "0.19"
alsa = "0.9"

[dev-dependencies]
