<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wyoming Satellite</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f8f9fa;
  --surface: #ffffff;
  --border: #e2e5e9;
  --text: #2c3e50;
  --text-muted: #7f8c97;
  --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  --green: #27ae60;
  --red: #c0392b;
  --amber: #e67e22;
  --blue: #2980b9;
  --badge-idle-bg: #eef1f5;
  --badge-idle-fg: #5a6a7a;
  --badge-streaming-bg: #e8f5e9;
  --badge-streaming-fg: #2e7d32;
  --badge-processing-bg: #fff3e0;
  --badge-processing-fg: #e65100;
  --badge-responding-bg: #e3f2fd;
  --badge-responding-fg: #1565c0;
  --sparkline-bg: #f4f6f8;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111117;
    --surface: #1a1a24;
    --border: #2a2a3a;
    --text: #d4d4dc;
    --text-muted: #7a7a8e;
    --green: #2ecc71;
    --red: #e74c3c;
    --amber: #f39c12;
    --blue: #3498db;
    --badge-idle-bg: #22222e;
    --badge-idle-fg: #8888a0;
    --badge-streaming-bg: #1a2e1a;
    --badge-streaming-fg: #4caf50;
    --badge-processing-bg: #2e2418;
    --badge-processing-fg: #ff9800;
    --badge-responding-bg: #182430;
    --badge-responding-fg: #42a5f5;
    --sparkline-bg: #16161e;
  }
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  padding: 1rem;
  max-width: 960px;
  margin: 0 auto;
}

header {
  margin-bottom: 1.25rem;
}

header h1 {
  font-size: 1.25rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

header .subtitle {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-top: 0.15rem;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.75rem;
}

@media (max-width: 700px) {
  .grid { grid-template-columns: 1fr; }
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.875rem 1rem;
}

.card-title {
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 0.5rem;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 0.2rem 0;
}

.label {
  font-size: 0.8rem;
  color: var(--text-muted);
}

.value {
  font-family: var(--mono);
  font-size: 0.8rem;
  font-weight: 500;
}

.dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 0.35rem;
  vertical-align: middle;
}

.dot-green { background: var(--green); }
.dot-red { background: var(--red); }
.dot-amber { background: var(--amber); }
.dot-blue { background: var(--blue); }

.state-badge {
  display: inline-block;
  font-family: var(--mono);
  font-size: 0.75rem;
  font-weight: 600;
  padding: 0.15rem 0.5rem;
  border-radius: 4px;
  background: var(--badge-idle-bg);
  color: var(--text);
}

.state-badge.idle { background: var(--badge-idle-bg); color: var(--badge-idle-fg); }
.state-badge.streaming { background: var(--badge-streaming-bg); color: var(--badge-streaming-fg); }
.state-badge.processing { background: var(--badge-processing-bg); color: var(--badge-processing-fg); }
.state-badge.responding { background: var(--badge-responding-bg); color: var(--badge-responding-fg); }

.sparkline-wrap {
  margin-top: 0.5rem;
  position: relative;
}

.sparkline-wrap canvas {
  width: 100%;
  height: 56px;
  display: block;
  border-radius: 4px;
  background: var(--sparkline-bg);
}

.stats-section {
  margin-top: 0.5rem;
  padding-top: 0.5rem;
  border-top: 1px solid var(--border);
}
.stats-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.35rem;
  font-size: 0.7rem;
  color: var(--text-muted);
}
.stats-grid {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 0.15rem 0.5rem;
  font-size: 0.75rem;
  font-family: var(--mono);
}
.reset-btn {
  font-size: 0.65rem;
  padding: 0.1rem 0.4rem;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
}
.reset-btn:hover { border-color: var(--red); color: var(--red); }
.clear-link {
  font-size: 0.65rem;
  color: var(--text-muted);
  text-decoration: none;
}
.clear-link:hover { color: var(--red); }

.history-list {
  list-style: none;
  max-height: 160px;
  overflow-y: auto;
  font-size: 0.75rem;
}

.history-list li {
  display: flex;
  justify-content: space-between;
  padding: 0.2rem 0;
  border-bottom: 1px solid var(--border);
  font-family: var(--mono);
}

.history-list li:last-child { border-bottom: none; }
.history-list .ts { color: var(--text-muted); }

.banner {
  display: none;
  background: var(--red);
  color: #fff;
  text-align: center;
  padding: 0.4rem;
  border-radius: 6px;
  font-size: 0.8rem;
  margin-bottom: 0.75rem;
}

.banner.visible { display: block; }

.threshold-control {
  display: flex;
  align-items: center;
  gap: 0.35rem;
}

.threshold-control input {
  width: 5rem;
  font-family: var(--mono);
  font-size: 0.75rem;
  padding: 0.15rem 0.35rem;
  border: 1px solid var(--border);
  border-radius: 4px;
  text-align: right;
  background: var(--bg);
  color: var(--text);
}

.threshold-control input:focus {
  outline: none;
  border-color: var(--blue);
}

.threshold-control button {
  font-size: 0.7rem;
  font-weight: 600;
  padding: 0.15rem 0.5rem;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface);
  color: var(--text-muted);
  cursor: pointer;
}

.threshold-control button:hover {
  background: var(--bg);
  border-color: var(--blue);
  color: var(--blue);
}

.threshold-control .flash-ok { animation: flashGreen 0.6s; }
.threshold-control .flash-err { animation: flashRed 0.6s; }

@keyframes flashGreen {
  0%, 100% { border-color: var(--border); }
  30% { border-color: var(--green); }
}
@keyframes flashRed {
  0%, 100% { border-color: var(--border); }
  30% { border-color: var(--red); }
}

.proto-out { color: var(--green); font-weight: 600; }
.proto-in { color: var(--blue); font-weight: 600; }
.proto-summary { color: var(--text-muted); font-weight: 400; }

#protocolEvents { max-height: 240px; }

.copy-link {
  position: fixed;
  top: 0.75rem;
  right: 0.75rem;
  font-size: 0.75rem;
  font-family: var(--mono);
  color: var(--text-muted);
  cursor: pointer;
  text-decoration: none;
  z-index: 10;
  padding: 0.25rem 0.5rem;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface);
  user-select: none;
}

.copy-link:hover {
  color: var(--blue);
  border-color: var(--blue);
}

#stageContainer {
  display: contents;
}

#stageContainer .stage-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.875rem 1rem;
}
</style>
</head>
<body>

<a class="copy-link" id="copyDump">copy current</a>

<div id="banner" class="banner">Dashboard disconnected &mdash; retrying&hellip;</div>

<header>
  <h1>
    <span class="dot dot-red" id="connDot"></span>
    <span id="satName">Wyoming Satellite</span>
  </h1>
  <div class="subtitle">
    <span id="area"></span>
  </div>
</header>

<div class="grid">

  <div class="card">
    <div class="card-title">Connection</div>
    <div class="row">
      <span class="label">Status</span>
      <span class="value" id="connStatus">&mdash;</span>
    </div>
    <div class="row">
      <span class="label">Server</span>
      <span class="value" id="serverAddr">&mdash;</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">State Machine</div>
    <div class="row">
      <span class="label">State</span>
      <span class="state-badge idle" id="stateBadge">&mdash;</span>
    </div>
    <div class="row">
      <span class="label">Feedback</span>
      <span class="value" id="feedbackState">&mdash;</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Frame Timing</div>
    <div class="row">
      <span class="label">Work / frame</span>
      <span class="value" id="workCurrent">&mdash;</span>
    </div>
    <div class="row">
      <span class="label">Avg (last 50)</span>
      <span class="value" id="workAvg">&mdash;</span>
    </div>
    <div class="row">
      <span class="label">Max (last 50)</span>
      <span class="value" id="workMax">&mdash;</span>
    </div>
    <div class="row">
      <span class="label">Headroom</span>
      <span class="value" id="workHeadroom">&mdash;</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Audio</div>
    <div class="row">
      <span class="label">Device</span>
      <span class="value" id="audioDevice">&mdash;</span>
    </div>
    <div class="row">
      <span class="label">Format</span>
      <span class="value" id="audioFormat">&mdash;</span>
    </div>
  </div>

  <div id="stageContainer"></div>

  <div class="card">
    <div class="card-title">Protocol Events</div>
    <ul class="history-list" id="protocolEvents">
      <li><span class="ts">waiting for data&hellip;</span></li>
    </ul>
  </div>

  <div class="card">
    <div class="card-title">State History</div>
    <ul class="history-list" id="stateHistory">
      <li><span class="ts">waiting for data&hellip;</span></li>
    </ul>
  </div>

</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
