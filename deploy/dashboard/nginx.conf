server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/event-stream application/json text/plain text/css application/javascript;
    gzip_min_length 256;

    location /api/ {
        proxy_pass http://satellite:8585/;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
    }
}
