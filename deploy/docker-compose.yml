# Production deployment for Raspberry Pi Zero W running wyoming-rust satellite.
#
# Usage:
#   1. Copy this directory to the Pi (or clone the repo)
#   2. Edit satellite.toml to match your hardware (ALSA device, area name, etc.)
#   3. docker compose up -d
#
# The avahi sidecar advertises the satellite via mDNS so Home Assistant
# can auto-discover it on the local network.

services:
  satellite:
    image: ghcr.io/bryanboettcher/wyoming-rust:armv6
    platform: linux/arm/v7
    container_name: wyoming-satellite
    ports:
      - "10700:10700"
      - "8585:8585"
    environment:
      - RUST_LOG=info
    volumes:
      - ./satellite.toml:/data/satellite.toml:ro
    devices:
      - /dev/snd:/dev/snd
    command: ["/data/satellite.toml"]
    # Override Dockerfile HEALTHCHECK: the ARMv6 runtime library overlay replaces
    # glibc 2.36 with 2.31, which breaks /bin/sh (and thus wget). Use the
    # dashboard service's health check to proxy-verify satellite liveness instead.
    healthcheck:
      disable: true
    restart: unless-stopped

  dashboard:
    image: nginx:alpine
    container_name: wyoming-dashboard
    ports:
      - "8080:80"
    volumes:
      - ./dashboard/index.html:/usr/share/nginx/html/index.html:ro
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - satellite
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/api/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  avahi:
    build:
      context: ./avahi
    container_name: wyoming-avahi
    network_mode: host
    environment:
      - SATELLITE_NAME=Wyoming Satellite
      - SATELLITE_PORT=10700
    restart: unless-stopped
