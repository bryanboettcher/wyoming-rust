# Production Wyoming satellite configuration for Raspberry Pi Zero W.
#
# Adjust [satellite].name and [satellite].area to match your deployment.
# Use `arecord -L` and `aplay -L` on the Pi to find your ALSA device names.

[satellite]
name = "pi-satellite"
area = "Living Room"

[server]
mode = "listen"
host = "0.0.0.0"
port = 10700

[audio]
device = "plughw:0,0"
playback_device = "plughw:0,0"
rate = 16000
width = 2
channels = 1
chunk_ms = 20

[pipeline]
silence_timeout_ms = 2500
buffer_seconds = 1.0

[pipeline.highpass]
cutoff_hz = 85.0

[pipeline.bandpass]
low_hz = 300.0
high_hz = 3000.0

[pipeline.zcr]

[pipeline.mfcc]

[pipeline.auto_energy]
attack_ratio = 3.0
sustain_ratio = 1.5
hold_frames = 10

[[feedback]]
method = "log"
